apiVersion: 1
groups:
  - orgId: 1
    name: litellm
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-litellm-upstream-failures
        title: LiteLLM upstream failing
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "LiteLLM is logging sustained upstream failures against {{ $labels.model }}; cli-proxy-api may be unhealthy"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (model) (rate(litellm_deployment_failure_responses[5m]))
              instant: true
              intervalMs: 60000
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.1
              refId: B
