apiVersion: 1
groups:
  - orgId: 1
    name: litellm
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-litellm-high-error-rate
        title: LiteLLM error rate above 10%
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "LiteLLM is returning errors for more than 10% of requests over the last 5 minutes ({{ printf \"%.0f\" (mul $values.A.Value 100.0) }}%)"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(litellm_proxy_failed_requests_metric[5m])) / clamp_min(sum(rate(litellm_proxy_total_requests_metric[5m])), 1)
              instant: true
              intervalMs: 60000
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.10
              refId: B
