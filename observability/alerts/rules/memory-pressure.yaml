apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-memory-pressure
        title: Memory usage >85%
        condition: B
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.instance }} memory usage is {{ $values.A.Value | humanizePercentage }}"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
              instant: true
              intervalMs: 60000
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.85
              refId: B
