apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-btrfs-allocation
        title: btrfs allocation >95%
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.instance }} btrfs is {{ $values.A.Value | humanizePercentage }} chunk-allocated (near exhaustion, writes may fail despite free space)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (instance, uuid) (node_btrfs_size_bytes * node_btrfs_allocation_ratio) / sum by (instance, uuid) (node_btrfs_device_size_bytes)
              instant: true
              intervalMs: 60000
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.95
              refId: B
