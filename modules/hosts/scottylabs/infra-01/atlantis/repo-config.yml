repos:
  - id: git.cmu.dev/ScottyLabs/governance
    repo_config_file: generated/atlantis.yaml
    apply_requirements: [mergeable, undiverged]
    import_requirements: [mergeable, undiverged]
    allowed_overrides: [apply_requirements]
    allow_custom_workflows: false
    workflow: governance
    pre_workflow_hooks:
      - run: nix run .#atlantis-hook -- "git+https://git.cmu.dev/$BASE_REPO_OWNER/$BASE_REPO_NAME?ref=$BASE_BRANCH_NAME"
        description: Generate tofu and autoplan the axes that differ from the base branch

  - id: git.cmu.dev/ScottyLabs/infrastructure
    plan_requirements: [mergeable]
    apply_requirements: [mergeable, undiverged]
    import_requirements: [mergeable, undiverged]
    allow_custom_workflows: false
    workflow: terranix
    pre_workflow_hooks:
      - run: nix flake archive
        description: Fetch flake inputs before parallel plans
      - run: install -m 644 "$(nix build --print-out-paths .#atlantis-yaml)" atlantis.yaml
        description: Generate atlantis.yaml from the flake

workflows:
  governance:
    plan:
      steps:
        - env:
            name: PATH
            command: 'echo "$DIR/../../governance/bin:$PATH"'
        - env:
            name: TF_CLI_CONFIG_FILE
            command: 'echo "$FORGEJO_TFRC"'
        - env:
            name: NIX_TERRAFORM_PLUGIN_DIR
            command: 'echo "$GOVERNANCE_PLUGIN_DIR"'
        - init
        - plan
    apply:
      steps:
        - env:
            name: PATH
            command: 'echo "$DIR/../../governance/bin:$PATH"'
        - env:
            name: TF_CLI_CONFIG_FILE
            command: 'echo "$FORGEJO_TFRC"'
        - env:
            name: NIX_TERRAFORM_PLUGIN_DIR
            command: 'echo "$GOVERNANCE_PLUGIN_DIR"'
        - apply
    import:
      steps:
        - env:
            name: PATH
            command: 'echo "$DIR/../../governance/bin:$PATH"'
        - env:
            name: TF_CLI_CONFIG_FILE
            command: 'echo "$FORGEJO_TFRC"'
        - env:
            name: NIX_TERRAFORM_PLUGIN_DIR
            command: 'echo "$GOVERNANCE_PLUGIN_DIR"'
        - import

  terranix:
    plan:
      steps:
        - env:
            name: TF_WORKSPACE
            value: default
        - env:
            name: TF_CLI_CONFIG_FILE
            command: 'echo "$FORGEJO_TFRC"'
        - env:
            name: NIX_TERRAFORM_PLUGIN_DIR
            command: 'echo "$TERRANIX_PLUGIN_DIR"'
        - run: nix build ".#$PROJECT_NAME.config" --out-link config.tf.json
        - run: tofu init -input=false
        - run: tofu plan -input=false -out "$PLANFILE"
    apply:
      steps:
        - env:
            name: TF_WORKSPACE
            value: default
        - env:
            name: TF_CLI_CONFIG_FILE
            command: 'echo "$FORGEJO_TFRC"'
        - env:
            name: NIX_TERRAFORM_PLUGIN_DIR
            command: 'echo "$TERRANIX_PLUGIN_DIR"'
        - run: tofu apply -input=false "$PLANFILE"
    import:
      steps:
        - env:
            name: TF_WORKSPACE
            value: default
        - env:
            name: TF_CLI_CONFIG_FILE
            command: 'echo "$FORGEJO_TFRC"'
        - env:
            name: NIX_TERRAFORM_PLUGIN_DIR
            command: 'echo "$TERRANIX_PLUGIN_DIR"'
        - run: nix build ".#$PROJECT_NAME.config" --out-link config.tf.json
        - run: tofu init -input=false
        - run: tofu import -input=false $(printf '%s' $COMMENT_ARGS | sed 's/,/ /' | tr -d '\\')

metrics:
  prometheus:
    endpoint: /metrics
