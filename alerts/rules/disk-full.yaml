apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-disk-full
        title: Root filesystem >75% full
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.instance }} root filesystem is {{ $values.A.Value | humanizePercentage }} full (threshold 75%)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) > 0.75
              instant: true
              intervalMs: 60000
              refId: A
