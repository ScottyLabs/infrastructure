apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-memory-pressure
        title: Memory usage >85%
        condition: A
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.instance }} memory usage is {{ $values.A.Value | humanizePercentage }}"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
              instant: true
              intervalMs: 60000
              refId: A
