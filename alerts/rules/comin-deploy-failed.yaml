apiVersion: 1
groups:
  - orgId: 1
    name: comin
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-comin-deploy-failed
        title: Comin deployment failed
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "comin on {{ $labels.instance }} last deployment failed (commit {{ $labels.commit_id }})"
          description: |
            Most recent deployment attempt on this host ended in failed status.
            Check `journalctl -u comin` on the host for the nix build or eval error.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: comin_deployment_info{status="failed"} == 1
              instant: true
              intervalMs: 60000
              refId: A
