apiVersion: 1
groups:
  - orgId: 1
    name: kennel
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-kennel-deploy-failed
        title: Kennel deployment failed
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.instance }} is in failed state"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: systemd_unit_state{name=~"kennel-.*\\.service",state="failed"} == 1
              instant: true
              intervalMs: 60000
              refId: A
