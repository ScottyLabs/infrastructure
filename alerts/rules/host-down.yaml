apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-host-down
        title: Host down
        condition: A
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.instance }} is not reporting metrics"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job=~"node|kennel|prometheus|loki|tempo|grafana"} == 0
              instant: true
              intervalMs: 60000
              refId: A
