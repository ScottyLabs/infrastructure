apiVersion: 1
groups:
  - orgId: 1
    name: litellm
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-litellm-down
        title: LiteLLM down
        condition: A
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "LiteLLM proxy on infra-01 is not responding to prometheus scrapes; all model traffic is failing"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="litellm"} == 0
              instant: true
              intervalMs: 60000
              refId: A
