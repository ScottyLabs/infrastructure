apiVersion: 1
groups:
  - orgId: 1
    name: comin
    folder: alerts
    interval: 1m
    rules:
      - uid: infra-comin-fetch-stalled
        title: Comin fetch stalled
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "comin on {{ $labels.instance }} has not polled successfully in the last 10m"
          description: |
            Comin polls every 15s. Successful fetch rate has been 0 over the last 10m
            even though the comin process is up. Usually means the remote is
            unreachable, repo auth is broken, or comin is wedged.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: rate(comin_fetch_count{status="succeeded"}[10m]) == 0 and on(instance) up{job="comin"} == 1
              instant: true
              intervalMs: 60000
              refId: A
